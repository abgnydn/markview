# SPDX-License-Identifier: Apache-2.0
#
# Cross-platform desktop release pipeline.
#
# Triggers:
#   - Push a tag matching `desktop-v*` (e.g. `desktop-v0.1.0`)
#   - Manual workflow_dispatch
#
# Builds the Tauri app on four runners and attaches every platform's
# installer to a single GitHub Release at:
#
#   https://github.com/abgnydn/markview/releases/latest
#
# Artifacts:
#   macOS arm64  → MarkView_<v>_aarch64.dmg
#   macOS x64    → MarkView_<v>_x64.dmg
#   Windows x64  → MarkView_<v>_x64-setup.exe + .msi
#   Linux x64    → markview_<v>_amd64.deb + .AppImage
#
# No code signing yet: builds are ad-hoc signed (no TeamIdentifier, not
# notarized). macOS 15+ REMOVED the old right-click → Open bypass, so
# users hit a hard "Apple could not verify… is free of malware" wall and
# must go through System Settings → Privacy & Security → Open Anyway.
# Do not advise right-click → Open anywhere; it no longer works.
#
# To ship signed + notarized builds, add these repo secrets and uncomment
# the APPLE_* block below (tauri-action notarizes automatically once they
# are present):
#   APPLE_CERTIFICATE           — base64 of the Developer ID .p12
#   APPLE_CERTIFICATE_PASSWORD  — its export password
#   APPLE_SIGNING_IDENTITY      — "Developer ID Application: NAME (TEAMID)"
#   APPLE_ID / APPLE_PASSWORD   — Apple ID + app-specific password
#   APPLE_TEAM_ID               — 10-char team id
# Requires a paid Apple Developer Program membership ($99/yr).

name: release-desktop

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-compile both Mac targets from a single Apple Silicon
          # runner — the Intel (macos-13) runner pool has been starving
          # the queue with 30-60min waits. The aarch64 native build also
          # produces the x86_64 binary via `--target x86_64-apple-darwin`.
          - os: macos-14
            target: aarch64-apple-darwin
            label: macOS arm64
          - os: macos-14
            target: x86_64-apple-darwin
            label: macOS x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Linux x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x64
    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.label }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build web (Vite → apps/web/out)
        run: bun --filter @markview/web build

      - name: Build + bundle Tauri + attach to Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # When signing keys land in repo secrets, uncomment:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Markview ${{ github.ref_name }}"
          releaseBody: |
            **Markview Desktop** — local-first markdown editor with sharing.

            ### Install

            - **macOS (recommended)** — `brew install --cask abgnydn/tap/markview`
              installs it ready to run, no Gatekeeper detour.
            - **macOS (.dmg)** — Drag MarkView to `/Applications`. These builds are
              **not code-signed**, so macOS blocks the first launch with “Apple could
              not verify… is free of malware”. To open: **System Settings → Privacy &
              Security → Open Anyway** (scroll to the Security section after trying to
              launch once). Terminal alternative:
              `xattr -dr com.apple.quarantine /Applications/MarkView.app`.
              *(Right-click → Open no longer works on macOS 15+.)*
            - **Windows** — Download the `.msi` and run it. SmartScreen will warn
              about an unrecognized app: **More info → Run anyway**.
            - **Linux** — Download the `.AppImage` (run directly) or `.deb`.

            Prefer no install? [markview.ai](https://markview.ai) is the same editor
            in the browser.

            ### Set as default markdown editor (macOS)

            Right-click any `.md` file → **Get Info** → **Open With** →
            **MarkView** → **Change All**.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
