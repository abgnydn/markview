<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbf8f3" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MarkView" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>MarkView — Markdown editor that stays on your machine</title>
    <meta
      name="description"
      content="A markdown editor with real-time collaboration and one-click share links. Runs in the browser or as a native desktop app (macOS, Windows, Linux). Local-first."
    />
    <link rel="canonical" href="https://markview.ai/" />
    <!-- Social cards. The image is generated by scripts/generate-og-home.mjs;
         every inner page already carries its own OG block via the prerender
         scripts — the homepage (the URL people actually share) was the one
         page missing it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MarkView" />
    <meta property="og:title" content="MarkView — Markdown editor that stays on your machine" />
    <meta property="og:description" content="Render, edit, present, and share markdown — entirely on your machine. No accounts, no uploads, no telemetry." />
    <meta property="og:url" content="https://markview.ai/" />
    <meta property="og:image" content="https://markview.ai/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MarkView — Markdown editor that stays on your machine" />
    <meta name="twitter:description" content="Render, edit, present, and share markdown — entirely on your machine. No accounts, no uploads, no telemetry." />
    <meta name="twitter:image" content="https://markview.ai/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "MarkView",
        "url": "https://markview.ai/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web, macOS, Windows, Linux",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://www.apache.org/licenses/LICENSE-2.0",
        "description": "Local-first markdown editor, viewer, and presenter. Runs in the browser or as a native desktop app — no accounts, no uploads, no telemetry."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
